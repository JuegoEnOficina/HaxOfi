<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Abrir en HaxOfi</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="HaxOfi">
<meta property="og:title" content="Comunidad de HaxOfi">
<meta property="og:description" content="Marcadores, pelotas, camisetas y mapas hechos por la comunidad. Se abren en HaxOfi.">
<meta property="og:image" content="https://haxofi.com/assets/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#D81F2A">
<link rel="icon" href="/assets/haxofi-icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<!--
  haxofi.com/i/#<id>: the share link of a Comunidad item. The id rides in the hash so this one static file serves
  every item and GitHub Pages needs no routing. The page hands the id to the installed app as haxofi://i/<id>
  (client src/lib/deepLink.js accepts exactly that shape) and offers the download when no app answers.
-->
<style>
:root{
  --ink:#05070C; --steel-a:#10151F; --edge:rgba(140,170,220,.16);
  --text:#EAF0F8; --dim:#7E8CA3; --red:#D81F2A; --blue:#3D7BFF;
  --display:"Barlow Condensed","Archivo Narrow","Arial Narrow","Roboto Condensed",sans-serif;
  --body:"Open Sans",system-ui,"Segoe UI",sans-serif;
  --skew:-4deg;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--ink);color:var(--text);
  font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;padding:24px}
main{width:100%;max-width:520px;text-align:center}
.logo{height:44px;width:auto;margin-bottom:28px}
h1{font-family:var(--display);font-style:italic;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
  font-size:clamp(34px,8vw,52px);line-height:1;margin:0 0 12px}
p{color:var(--dim);margin:0 0 26px}
.btn{display:inline-block;border:0;color:#fff;font-family:var(--display);font-style:italic;font-weight:700;
  text-transform:uppercase;letter-spacing:.08em;font-size:18px;text-decoration:none;padding:15px 26px;
  transform:skewX(var(--skew));background:var(--red);cursor:pointer;transition:filter .12s}
.btn[hidden]{display:none}
.btn:hover{filter:brightness(1.12)}
.btn:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.get{margin-top:40px;padding-top:26px;border-top:1px solid var(--edge)}
.get[hidden]{display:none}
.get h2{font-family:var(--display);font-style:italic;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
  font-size:22px;margin:0 0 14px}
.os{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.os a{color:var(--text);text-decoration:none;border:1px solid var(--edge);background:var(--steel-a);
  padding:10px 18px;font-weight:600}
.os a:hover{border-color:var(--text)}
</style>
</head>
<body>
<main>
  <img class="logo" src="/assets/haxofi-lockup.svg" alt="HaxOfi">
  <h1 id="title">Abrir en HaxOfi</h1>
  <p id="lead">Contenido de la Comunidad de HaxOfi.</p>
  <a class="btn" id="open" href="#" hidden>Abrir en HaxOfi</a>
  <section class="get" id="get" hidden>
    <h2>¿Todavía no tenés HaxOfi?</h2>
    <div class="os">
      <a href="/base/">Windows</a>
      <a href="/base-linux/">Linux</a>
      <a href="/base-mac-apple/">Mac</a>
    </div>
  </section>
</main>
<script>
(function () {
  var match = /^#([A-Za-z0-9]{8})$/.exec(location.hash);
  var get = document.getElementById('get');
  if (!match) {
    document.getElementById('title').textContent = 'Enlace no válido';
    document.getElementById('lead').textContent = 'Este enlace de Comunidad no lleva a ningún contenido.';
    get.hidden = false;
    return;
  }
  var link = 'haxofi://i/' + match[1];
  var open = document.getElementById('open');
  open.href = link;
  open.hidden = false;
  // The browser asks before handing the link to the app; if the page is still in front two seconds later, the
  // app most likely is not installed (or the jump was blocked), so the download shows up next to the button.
  setTimeout(function () { if (document.visibilityState === 'visible') get.hidden = false; }, 2000);
  location.href = link;
})();
</script>
</body>
</html>
